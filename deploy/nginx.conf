# 同域部署：前端静态站与后端 API 在同一个域名下，浏览器天然带 Cookie，不需要 CORS。
#   /                 → 前端 Vite 构建产物（history 模式回退 index.html）
#   /api/             → Django
#   /_allauth/        → Django（allauth headless 的注册/登录/验证邮箱/重置密码）
#   /manage-console/  → Django admin（路径与 DJANGO_ADMIN_URL 保持一致）
#   /media/avatars/   → 公开头像直出（**站内唯一的公开媒体**）
#   /media/protected/ → internal，只能由 Django 的 X-Accel-Redirect 触发
#   /media/ 其余路径  → 一律 404
#
# 2026-09-21 前端安全对抗审计改写；2026-09-23 本机 compose 部署测试跑通（Caddy → 本容器 → Django）。
# 拓扑：Caddy（deploy/Caddyfile，对外 80/443、自动证书）→ 本容器（只在 compose 内网听 80）→ gunicorn。
# 首次上线仍按「上线自检」一节逐条核。
#
# ── add_header 的坑（本次改写的主因之一）────────────────────────────────────
# nginx 的 add_header **不会**从上层继承到「自己也写了 add_header 的 location」。
# 改写前 server 级写了 3 个安全头，而 /assets/ 与 /media/ 各自 add_header 之后，
# 那 3 个头在这两个 location 下就**一个都不发了**。所以下面每个 location 都把
# 整套头重写一遍（nginx 没有 include 之外的复用手段，而 compose 只挂了本文件）。

# HSTS 只在真的走 HTTPS 时才发（本容器只听 80，TLS 由前面的 Caddy 终结，
# 结果从 X-Forwarded-Proto 判断）。值为空时 nginx 会跳过这个头。
map $http_x_forwarded_proto $hsts_value {
    default "";
    "https"  "max-age=31536000; includeSubDomains";
}

# 转发给 Django 的 X-Forwarded-Proto（proxy_params_trpg 用）：前面的 Caddy 说 https 就沿用，
# 否则退回本容器自己的 $scheme。本容器不发布宿主端口，只能被 Caddy 访问，这个头不可能被外部伪造。
map $http_x_forwarded_proto $trpg_forwarded_proto {
    default $scheme;
    "https"  "https";
}

upstream django {
    server django:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    server_tokens off;          # 不在响应头/错误页里报 nginx 版本号

    # 上传上限：角色卡 20 MB（charactercards/validators.py: CARD_FILE_MAX_BYTES）、
    # 相册单图 10 MB（gallery/models.py: PHOTO_MAX_BYTES）、
    # 后端 DATA_UPLOAD_MAX_MEMORY_SIZE 默认 20 MB。
    # 给 21m：够 20 MB 正文 + multipart 边界与字段的开销，又不给攻击者多余的余量。
    # **改后端限额时必须同步改这里**，否则大文件会死在 nginx 的 413 上、前端看不到后端的错误文案。
    client_max_body_size 21m;
    client_body_timeout 30s;
    charset utf-8;

    # gzip 只压静态资源。gzip_proxied 显式 off：反代回来的响应（带会话 Cookie、
    # 正文里有 CSRF token）不压缩，避免 BREACH 那一类「压缩率侧信道猜 token」。
    # 静态资源没有任何随请求变化的秘密，压它不构成这个风险。
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_proxied off;
    gzip_vary on;

    # ---------- 先堵掉不该被访问的路径 ----------
    # 正则 location 优先于前缀 location，所以这两条放前面即可生效。

    # 点文件：.env / .git / .DS_Store …（放行 ACME 的 /.well-known/）
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # sourcemap 与备份/日志/数据库类后缀：正常部署里不该有，有也不许发出去。
    # （构建本身已经 `build.sourcemap: false`，这一条是「万一哪天被改开」的第二道闸。）
    #
    # `^(?!/media/)` 不能省：X-Accel-Redirect 的内部跳转**会重新走一遍 location 匹配**，
    # 而资源区的文件名后缀原样取自上传文件（apps/resources/models.py resource_upload_to），
    # 站主真传了一份 `.yml` 规则书，这条规则就会把已经鉴权通过的下载 403 掉。
    location ~* ^(?!/media/).*\.(map|bak|old|orig|swp|sql|sqlite3?|log|ini|conf|yml|yaml)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ---------- 前端 ----------
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;     # 不写 $uri/：SPA 不需要目录索引
        autoindex off;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
        add_header Strict-Transport-Security $hsts_value always;

        # CSP：**脚本不给 unsafe-inline / unsafe-eval**。
        # 已核对构建产物 dist/index.html：只有一个 <script type="module" src="/assets/…">，
        # 没有任何内联 script，所以 script-src 'self' 足够。
        # style-src 也给了 'self' 而不是 'unsafe-inline'：Vue 的 `:style` 绑定走的是
        # CSSOM（@vue/runtime-dom patchStyle → setStyle(el.style, …)，源码已核对，
        # 全程没有 setAttribute('style')），CSP 不管 CSSOM 写入；SFC 的 <style> 被 vite
        # 抽成了独立 .css 文件。将来真需要内联样式，**用 nonce，不要加 'unsafe-inline'**。
        # img-src 要 data:：styles/base.css 的纸纹底噪是一段内联 SVG 的 data: URI。
        # connect-src 'self'：全站同域，没有跨域接口。
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; media-src 'self'; worker-src 'none'; manifest-src 'self'" always;
    }

    # 带内容哈希的产物，可以长缓存
    location /assets/ {
        root /usr/share/nginx/html;
        autoindex off;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable" always;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Strict-Transport-Security $hsts_value always;
    }

    # ---------- 后端 ----------
    location /api/ {
        proxy_pass http://django;
        include /etc/nginx/proxy_params_trpg;

        # Django 自己也发一部分（SecurityMiddleware / XFrameOptionsMiddleware），
        # 这里补齐它不发的那些。重复的头浏览器按第一个算，取值一致不冲突。
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
        # HSTS 不在这儿加：Django 的 SecurityMiddleware（prod.py SECURE_HSTS_SECONDS）
        # 已经为反代回来的响应发过了，重复发只会出现两个同名头。
        # 接口只回 JSON，不会被当页面渲染，但仍然不许被塞进 iframe
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    }

    location /_allauth/ {
        proxy_pass http://django;
        include /etc/nginx/proxy_params_trpg;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
        # 登录/注册/重置密码的响应绝不缓存（中间盒与浏览器都别留）
        add_header Cache-Control "no-store" always;
    }

    # Django admin：**只有站主用**。路径已经从 /admin/ 改成 DJANGO_ADMIN_URL，
    # 但「改过路径」不等于安全，强烈建议再按来源 IP 收一道。
    #
    #   上线时把下面两行取消注释并换成站主的固定出口 IP（多条就写多行 allow）：
    #   allow 203.0.113.9;
    #   deny  all;
    #
    # 没有固定 IP 的话，至少在前置的 TLS 终结点上加 HTTP Basic 或 IP 白名单；
    # 不要只靠「路径难猜」。
    location /manage-console/ {
        proxy_pass http://django;
        include /etc/nginx/proxy_params_trpg;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        # 后台页面绝不进缓存（里面全是他人隐私数据）
        add_header Cache-Control "no-store" always;
        # 后台不发严格 CSP：Django admin 的模板里有内联 <script>/<style>，
        # 加 script-src 'self' 会把后台弄瘫，而它本来就只给站主一个人用。
        # 这里只收口三件不影响功能的：不许被嵌、不许改 base、表单只能提交回本站。
        add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        # 后台是纯 HTML，Referrer 收到最紧，别把后台 URL 带去外站
        add_header Referrer-Policy "same-origin" always;
    }

    # Django 自己的静态资源（后台用；前端产物不走这里）
    location /static/ {
        alias /app/staticfiles/;
        autoindex off;
        expires 30d;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Strict-Transport-Security $hsts_value always;
    }

    # ---------- 媒体 ----------
    # 受保护媒体：internal 表示外部 URL 打不进来，
    # 只有 Django 鉴权通过后回的 X-Accel-Redirect 才能命中这里。
    # 前缀必须与 settings.X_ACCEL_REDIRECT_PREFIX（默认 "/media/protected/"）一致；
    # 目录必须与 MEDIA_ROOT/protected 对得上（compose 把 media_data 挂在 /app/media）。
    # 角色卡、资源文件、战报附件、相册三档图**全部**落在这里（已核对各 app 的 upload_to）。
    location /media/protected/ {
        internal;
        alias /app/media/protected/;
        add_header X-Content-Type-Options "nosniff" always;
        # 万一哪天有人把一份 HTML 当附件传进来、Content-Type 又没拦住，
        # sandbox 让它即使被直接打开也跑不了脚本、拿不到本站的同源身份。
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    # 公开媒体白名单：目前**只有头像**（apps/accounts/models.py avatar_upload_to
    # → "avatars/<uuid>.webp"，服务端已缩图转 WebP）。
    # 这里刻意只开这一个子路径，而不是整个 /media/ 直出：
    # 相册里是真人活动照片，一旦哪天有人把图落到 protected/ 之外，
    # 整个 /media/ 直出就等于绕过后端的相册鉴权，把人脸照片挂到公网上。
    # **将来真要新增公开媒体，必须在这里显式再开一个 location，不要改回 `location /media/`。**
# （公开媒体现有两处：本段头像 + 下面的 /media/homecontent/；新增 app 的 upload_to 不落 protected/ 时都要来这里登记。）
    location /media/avatars/ {
        alias /app/media/avatars/;
        autoindex off;
        expires 7d;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Strict-Transport-Security $hsts_value always;
    }

    # 站主配置的首页素材（规则预设三档图、快速选择图；apps/homecontent/models.py site_image_upload_to
    # → "homecontent/<uuid>-<档位>.webp"，服务端已重编码为 WebP、uuid 命名）。
    # 这是站主自己选的公开素材，不是真人活动照片，与头像同等对待直出。
    # 2026-09-23 本机部署测试补：homecontent 应用晚于本文件诞生，之前漏开，首页配图在生产会 404。
    location /media/homecontent/ {
        alias /app/media/homecontent/;
        autoindex off;
        expires 7d;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Strict-Transport-Security $hsts_value always;
    }

    # /media/ 的其余一切：不直出。
    # 私密文件一律走 Django 鉴权视图（它再用 X-Accel-Redirect 命中上面的 internal）。
    location /media/ {
        return 404;
    }
}

# ── 上线自检（本文件没在本机跑过，逐条核完再放流量）────────────────────────
#  1. `nginx -t`；`docker compose config` 语法通过。
#  2. `curl -I https://站点/` 能看到 CSP / X-Content-Type-Options / X-Frame-Options /
#     Referrer-Policy / Permissions-Policy；`curl -I https://站点/assets/<任一文件>` 同样有。
#  3. 打开首页看浏览器控制台**没有 CSP 违例**（尤其 style-src：本站理论上不产生内联样式，
#     真出现违例就把该处改成外部样式表或 nonce，**不要**加 'unsafe-inline'）。
#  4. `curl -I https://站点/media/protected/任意名` → 404（internal 不给外部打）。
#  5. `curl -I https://站点/media/gallery/任意名` → 404（相册图不直出）。
#  6. `curl -I https://站点/media/avatars/<真实头像名>` → 200；首页配图 `/media/homecontent/<真实名>` → 200。
#  7. `curl -I https://站点/.env` `…/.git/config` `…/assets/x.js.map` → 403/404。
#  8. 传一个 20 MB 的角色卡能过；传 25 MB 的收到后端的业务报错而不是 nginx 的 413 页。
#  9. 站主在自己的网络下能打开 /manage-console/；启用 IP 白名单后换个网络打不开。
# 10. 登录后 `curl -I` 看 `/_allauth/...` 的响应**没有 Content-Encoding: gzip**
#     （gzip_proxied off 生效，BREACH 面收掉）。
